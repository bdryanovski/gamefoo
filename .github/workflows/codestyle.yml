name: CodeStyle CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  codestyle-check:
    name: CodeStyle Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Biome lint
        run: pnpm run lint

      - name: CodeStyle compliance check
        run: pnpm run lint:codestyle

      - name: Build
        run: pnpm run build

  summary:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: codestyle-check
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CodeStyle report
        run: |
          echo "# CodeStyle Compliance Report" > codestyle-report.md
          echo "" >> codestyle-report.md
          echo "## Summary" >> codestyle-report.md
          echo "" >> codestyle-report.md
          
          # Run checks and capture output
          pnpm run lint:codestyle > codestyle-output.txt 2>&1 || true
          
          # Append output to report
          echo '```' >> codestyle-report.md
          cat codestyle-output.txt >> codestyle-report.md
          echo '```' >> codestyle-report.md
          
          # Display report
          cat codestyle-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: codestyle-report
          path: codestyle-report.md
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('codestyle-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
