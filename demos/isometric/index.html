<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isometric World — GameFoo Demo</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      body {
        background: #0d0d1a;
        color: #ccc;
        font-family: "Courier New", monospace;
        justify-content: flex-start;
        padding: 20px;
      }
      h1 { color: #7fdbca; letter-spacing: 2px; }
      #info {
        color: #666;
        font-size: 0.75rem;
        margin-bottom: 12px;
        line-height: 1.6;
      }
      #game-container {
        border-radius: 4px;
        box-shadow: 0 0 30px rgba(100, 180, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <h1>Isometric World</h1>
    <p id="info">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows — move &nbsp;|&nbsp;
      <kbd>G</kbd> — toggle grid &nbsp;|&nbsp;
      <kbd>P</kbd> — toggle pathfinding debug &nbsp;|&nbsp;
      <kbd>C</kbd> — toggle collision bounds &nbsp;|&nbsp;
      <kbd>+</kbd>/<kbd>-</kbd> — zoom
    </p>
    <div id="game-container">
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="./game.ts"></script>
  </body>
</html>
